<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClearPath – Coordinator &amp; Admin prototype</title>
<!--
USER STORIES COVERED: read-only escalation view with yellow/red zones + empty state + patient-role denied; loneliness/self-harm
flag surfaced; "no appointment date" flag; no-check-in-for-2-days flag; patient drawer with SVG weight trend; no-PHI audit table
(discharge_id / event / deleted_at / deleted_items, no names, diagnoses, or plan text); per-record expiry countdown;
expires_at = created_at + 2,592,000 s shown as server-set and non-editable; encryption in transit / at rest + synthetic-data
status row; DEMO ONLY Time-Travel that expires a record, removes the row, adds an audit entry, and is hidden in Production;
verification panel showing database 404 and audio not found. All data is synthetic.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF7F0; --card:#FFFFFF; --panel:#F4EFE6; --line:#E2DACB; --text:#231F1A; --muted:#51493F;
  --ink:#0F4C5C; --ink-soft:#2A6B7C; --primary:#0F4C5C; --on-primary:#fff; --rail:#0F4C5C; --on-rail:#EAF4F6;
  --sage:#4F8A62; --sage-bg:#E7F0E8; --sage-fg:#244C31; --blue:#2F6DA3; --blue-bg:#E2ECF4; --blue-fg:#173F66;
  --amber:#C6821F; --amber-bg:#FBEFD8; --amber-fg:#5E3600; --red:#B22A2A; --red-bg:#F7E0DE; --red-fg:#7D1515; --red-solid:#B22A2A;
  --gray:#8A857B; --gray-bg:#EFEAE0; --gray-fg:#3F3A32; --shadow1:0 2px 8px rgba(20,20,20,.06); --shadow2:0 8px 24px rgba(20,20,20,.10); --focus:#0F4C5C;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#121C1B; --card:#1B2928; --panel:#172423; --line:#2D403E; --text:#F3EEE4; --muted:#CFC8BA;
  --ink:#8ED6E4; --ink-soft:#6CC7D9; --primary:#6CC7D9; --on-primary:#08262D; --rail:#0B2F38; --on-rail:#DDF1F5;
  --sage:#7FBF93; --sage-bg:#20392A; --sage-fg:#C9E9D2; --blue:#7FB2DE; --blue-bg:#1C3348; --blue-fg:#C7DFF4;
  --amber:#E0A64A; --amber-bg:#3E2F10; --amber-fg:#F8DEA8; --red:#F07F78; --red-bg:#4B1F1D; --red-fg:#FFD3CE;
  --gray:#A29D91; --gray-bg:#2A2F2D; --gray-fg:#D9D4C8; --focus:#8ED6E4;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--text);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input{font-family:inherit;font-size:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:600}
h1{font-family:Fraunces,Georgia,serif;font-size:26px;line-height:1.2;letter-spacing:-.01em}
h2{font-family:Fraunces,Georgia,serif;font-size:20px;line-height:1.25}
h3{font-size:15px}
p{margin:0 0 10px}
.muted{color:var(--muted)}.tn{font-variant-numeric:tabular-nums}.ic{flex:none}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;height:100dvh}
.rail{background:var(--rail);color:var(--on-rail);display:flex;flex-direction:column;padding:18px 12px;gap:6px}
.rail .brand{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;color:#fff;display:flex;gap:8px;align-items:center;padding:4px 8px 16px}
.rail button.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:0;border-radius:12px;background:transparent;color:inherit;font-weight:700;text-align:left}
.rail button.nav:hover{background:rgba(255,255,255,.1)}.rail button.nav.on{background:rgba(255,255,255,.18);color:#fff}
.rail .sp{flex:1}.rail .proto{border:2px dashed rgba(255,255,255,.5)}.rail small{opacity:.8;padding:0 8px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .sp{flex:1}
.role{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:var(--on-primary);padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
.mode{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;font-weight:700;min-height:34px}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.content{flex:1;overflow:auto;padding:24px 28px 60px}
@media (max-width:900px){.app{grid-template-columns:68px 1fr}.rail .lbl,.rail small,.rail .brand span.t{display:none}.content{padding:18px 16px 60px}.topbar{padding:10px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow1)}
.card+.card,.card+.banner{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 18px;border-radius:12px;border:2px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink-soft)}
.btn.amber{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-fg)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.5;white-space:nowrap}
.chip.gray{background:var(--gray-bg);color:var(--gray-fg)}.chip.amber{background:var(--amber-bg);color:var(--amber-fg)}
.chip.sage{background:var(--sage-bg);color:var(--sage-fg)}.chip.red{background:var(--red-bg);color:var(--red-fg)}.chip.blue{background:var(--blue-bg);color:var(--blue-fg)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}
.stat{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:12px;font-weight:700}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 16px;margin:12px 0;font-weight:700}
.banner.red{background:var(--red-bg);color:var(--red-fg);border:2px solid var(--red)}
.banner.amber{background:var(--amber-bg);color:var(--amber-fg);border:2px solid var(--amber)}
.banner.sage{background:var(--sage-bg);color:var(--sage-fg);border:2px solid var(--sage)}
.banner.blue{background:var(--blue-bg);color:var(--blue-fg);border:2px solid var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:13px;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
tr.gone td{opacity:.55;background:var(--gray-bg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.proof{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media (max-width:900px){.proof{grid-template-columns:1fr}}
.proof .card{background:var(--panel)}
.lockfield{display:flex;gap:10px;align-items:center;background:var(--gray-bg);border:2px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--gray-fg);margin-top:8px}
.empty{text-align:center;padding:40px 20px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,15,15,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--paper);z-index:31;box-shadow:var(--shadow2);padding:24px;overflow:auto;border-left:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .22s ease}@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}}
.menu{position:fixed;left:244px;bottom:16px;width:320px;max-height:78vh;overflow:auto;background:var(--card);border:2px solid var(--ink-soft);border-radius:16px;box-shadow:var(--shadow2);z-index:40;padding:10px}
.menu .g{font-size:12px;font-weight:700;color:var(--muted);margin:10px 6px 2px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:700;font-size:13px;color:var(--text)}.menu button:hover{background:var(--panel)}
@media (max-width:900px){.menu{left:76px}}
.toast{position:fixed;right:24px;top:20px;z-index:60;background:var(--sage-bg);color:var(--sage-fg);border:2px solid var(--sage);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow2);max-width:380px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Main navigation">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M3 22c4-12 22-12 26 0" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M3 22h26" stroke="#8FD0A5" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="10.5" r="3" fill="#F0B65A"/></svg><span class="t">ClearPath</span></div>
    <button class="nav on" id="nav-esc" data-act="view" data-v="esc"><i data-ic="alert"></i><span class="lbl">Escalations</span></button>
    <button class="nav" id="nav-audit" data-act="view" data-v="audit"><i data-ic="shield"></i><span class="lbl">Audit &amp; Purge</span></button>
    <span class="sp"></span>
    <button class="nav proto" data-act="menu" aria-haspopup="true"><i data-ic="menu"></i><span class="lbl">Prototype navigation</span></button>
    <small>Synthetic data only</small>
  </aside>
  <div class="main">
    <header class="topbar"><span class="role"><i data-ic="user" data-s="16"></i>Role: Care Coordinator — Sam Ortiz</span><span class="sp"></span>
      <span class="mode">Mode: <span class="seg" role="group" aria-label="Mode"><button id="m-demo" class="on" data-act="mode" data-v="demo" aria-pressed="true">Demo</button><button id="m-prod" data-act="mode" data-v="prod" aria-pressed="false">Production</button></span></span></header>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="layer"></div><div id="toastBox"></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const IC={alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L15.5 10"/>',
menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
siren:'<path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 18h14v3H5zM12 3v2M4.5 6l1.5 1.5M19.5 6L18 7.5"/>',
chev:'<path d="M9 5l7 7-7 7"/>',db:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',minus:'<path d="M5 12h14"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
const hy=(r=document)=>$$('i[data-ic]',r).forEach(e=>{const t=document.createElement('span');t.innerHTML=ic(e.dataset.ic,+e.dataset.s||18);e.replaceWith(t.firstChild)});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(m){const b=$('#toastBox');b.innerHTML=`<div class="toast" role="status">${m}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>b.innerHTML='',3800)}

/* ---------- data (dates are relative to today so the prototype never looks stale) ---------- */
const NOW=Date.now(),D=864e5,H=36e5;
const ROWS=[
 {id:1,name:'Eleanor Okafor',dx:'Heart failure (reduced EF)',zone:'yellow',trigger:'Weight up 4 lb',flag:'',last:'Today 7:58 AM',kind:'weight',contacted:false},
 {id:2,name:'Walter Brennan',dx:'Kidney stone, ureteral stent',zone:'red',trigger:'Reported chest pain',flag:'',last:'Today 8:10 AM',kind:'chest',contacted:false},
 {id:3,name:'Rosa Delgado',dx:'Heart failure (preserved EF), AFib',zone:'yellow',trigger:'More swelling',flag:'',last:'Yesterday',kind:'swell',contacted:false},
 {id:4,name:'Mei Chen',dx:'Sepsis / UTI',zone:'gray',trigger:'No check-in',flag:'No check-in for 2 days',last:'2 days ago',kind:'nocheck',contacted:false},
 {id:5,name:'Harold Pike',dx:'COPD',zone:'',trigger:'',flag:"Mental-health flag: said “I feel alone” (988 shown)",last:'Today 9:05 AM',kind:'mh',contacted:false},
 {id:6,name:'Grace Lin',dx:'Kidney stone, ureteral stent',zone:'',trigger:'',flag:'No appointment date set (urology / stent)',last:'—',kind:'appt',contacted:false}];
const WEIGHTS=[181,181,182,182,181,182,186];
const mkAudit=()=>[
 {id:'DSC-7Q2K',event:'published',created:NOW-(2*D+20*H),exp:NOW-(2*D+20*H)+30*D,del:null,items:'—',state:'live'},
 {id:'DSC-3A8M',event:'published',created:NOW-(13*D+16*H),exp:NOW-(13*D+16*H)+30*D,del:null,items:'—',state:'live'},
 {id:'DSC-9F1C',event:'purged',created:NOW-62*D,exp:NOW-32*D,del:NOW-32*D,items:'audio, transcript, translations, chat logs',state:'purged'}];
const E={view:'esc',esc:'list',mode:'demo',audit:mkAudit(),tt:false,drawer:null};

const zoneChip=z=>z==='red'?`<span class="chip red">${ic('siren',14)}Red · call 911 advised</span>`:z==='yellow'?`<span class="chip amber">${ic('phone',14)}Yellow · call today</span>`:z==='gray'?`<span class="chip gray">${ic('minus',14)}No check-in</span>`:'<span class="muted">—</span>';
const utc=t=>new Date(t).toISOString().slice(0,19).replace('T',' ')+'Z';
function left(t){const ms=t-Date.now();if(ms<=0)return 'Expired';const d=Math.floor(ms/D),h=Math.floor(ms%D/H);return `${d}d ${String(h).padStart(2,'0')}h left`}

/* ---------- escalations ---------- */
function rEsc(){
  if(E.esc==='denied')return `<h1>Who needs attention</h1><div class="banner red" role="alert" style="margin-top:16px">${ic('lock',24)}<span>Access denied. This view is for care staff only.</span></div>`;
  if(E.esc==='empty')return `<h1>Who needs attention</h1><div class="card empty" style="margin-top:16px;background:var(--sage-bg);color:var(--sage-fg);border-color:var(--sage)"><div>${ic('check',44)}</div><h2 style="margin-top:8px">All clear. No escalations right now.</h2><p>New check-ins will appear here.</p></div>`;
  const red=ROWS.filter(r=>r.zone==='red').length,yel=ROWS.filter(r=>r.zone==='yellow').length,fl=ROWS.filter(r=>r.flag).length;
  return `<h1>Who needs attention</h1>
  <div class="stats" aria-label="Summary"><span class="stat" style="background:var(--red-bg);color:var(--red-fg)">${ic('siren',16)}Red: ${red}</span><span class="stat" style="background:var(--amber-bg);color:var(--amber-fg)">${ic('phone',16)}Yellow: ${yel}</span><span class="stat" style="background:var(--blue-bg);color:var(--blue-fg)">${ic('alert',16)}Flags: ${fl}</span></div>
  <div class="card scroll-x" style="padding:6px 8px"><table><thead><tr><th>Patient (synthetic)</th><th>Zone</th><th>Trigger</th><th>Flag</th><th>Last check-in</th><th></th></tr></thead><tbody>
  ${ROWS.map(r=>`<tr><td><b>${r.name}</b>${r.contacted?` <span class="chip sage">${ic('check',14)}Contacted</span>`:''}</td><td>${zoneChip(r.zone)}</td><td>${r.trigger||'—'}</td><td>${r.flag?`<span class="chip blue">${ic(r.kind==='mh'?'chat':r.kind==='appt'?'cal':'clock',14)}${r.flag}</span>`:'—'}</td><td class="tn">${r.last}</td><td><button class="btn ghost sm" data-act="drawer" data-v="${r.id}">View</button></td></tr>`).join('')}
  </tbody></table></div><p class="muted" style="margin-top:12px;font-size:13px">Read-only. Every row shows an icon, a label, and a color, so no status depends on color alone. Names are synthetic.</p>`;
}
function chart(){
  const w=420,h=210,l=46,b=36,t=14,r=14,min=178,max=188,n=WEIGHTS.length;
  const x=i=>l+i*(w-l-r)/(n-1),y=v=>t+(max-v)*(h-t-b)/(max-min);
  const pts=WEIGHTS.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Weight trend over 7 days: steady near 182 pounds, then 186 pounds today" style="max-width:${w}px">
   ${[178,180,182,184,186,188].map(v=>`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
   ${WEIGHTS.map((v,i)=>`<text x="${x(i)}" y="${h-14}" text-anchor="middle" font-size="11" fill="var(--muted)">${i+1}</text>`).join('')}
   <text x="${(l+w-r)/2}" y="${h-1}" text-anchor="middle" font-size="12" fill="var(--muted)">Day</text>
   <text transform="translate(11 ${(t+h-b)/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="var(--muted)">Weight (lb)</text>
   <polyline points="${pts}" fill="none" stroke="var(--ink-soft)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
   ${WEIGHTS.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?7:4}" fill="${i===n-1?'var(--amber)':'var(--card)'}" stroke="${i===n-1?'var(--amber-fg)':'var(--ink-soft)'}" stroke-width="2.5"/>`).join('')}
   <text x="${x(n-1)-10}" y="${y(186)-12}" text-anchor="end" font-size="12" font-weight="700" fill="var(--amber-fg)">+4 lb</text></svg>`;
}
function openDrawer(id){
  const r=ROWS.find(x=>x.id==id);E.drawer=id;
  const det={weight:['Weight 182 → 186 lb (+4 lb). Symptoms: more swelling.','Call patient to review weight plan.'],
   chest:['Reported chest pain. The patient was shown the 911 screen.','Call the patient now to confirm they called 911 or have been seen.'],
   swell:['Reported more swelling.','Call patient to review the weight plan.'],
   nocheck:['No check-in for 2 days.','Call to check in and remind the patient about the daily check-in.'],
   mh:['The patient said “I feel alone.” The app showed 988 and said the care team was told.','Call the patient today and offer follow-up support.'],
   appt:['No appointment date is set for urology. The stent must not be forgotten.','Help the patient schedule the urology visit.']}[r.kind];
  const head=r.zone?zoneChip(r.zone):`<span class="chip blue">${ic('alert',14)}Flag</span>`;
  $('#layer').innerHTML=`<div class="drawer-bg" data-act="closedrawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dH">
   <div style="display:flex;justify-content:space-between;gap:10px"><div><h2 id="dH">${r.name} · ${r.dx}</h2><div style="margin-top:8px">${head}</div></div><button class="btn ghost sm" data-act="closedrawer" aria-label="Close">${ic('x',16)}Close</button></div>
   ${r.kind==='weight'?`<div class="card" style="margin-top:18px"><h3 class="muted" style="margin-bottom:6px">Weight trend, last 7 days</h3>${chart()}</div>`:''}
   <div class="card" style="margin-top:16px"><h3 class="muted">Check-in detail</h3><p style="margin:6px 0 0">${det[0]}</p></div>
   <div class="banner amber" style="margin-top:16px">${ic('phone',22)}<div><b>Recommended action</b><div style="font-weight:400">${det[1]}</div></div></div>
   <p class="muted" style="font-size:13px">Synthetic data. This view shows only what is needed for follow-up.</p>
   <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" data-act="contacted" data-v="${r.id}">${ic('check',16)}Mark contacted</button><button class="btn ghost" data-act="closedrawer">Close</button></div></aside>`;
  hy($('#layer'));$('#layer .drawer .btn').focus();
}

/* ---------- audit ---------- */
function rAudit(){
  const demo=E.mode==='demo',active=E.audit.find(a=>a.id==='DSC-7Q2K'&&a.state==='live');
  const ex=E.audit.find(a=>a.id==='DSC-7Q2K');
  return `<h1>Audit &amp; data lifecycle</h1>
  <div class="stats" style="margin-top:14px"><span class="chip sage" style="padding:6px 12px">${ic('lock',14)}TLS in transit: ON</span><span class="chip sage" style="padding:6px 12px">${ic('shield',14)}Encryption at rest: ON</span><span class="chip sage" style="padding:6px 12px">${ic('db',14)}Synthetic data only: ON</span></div>
  <div class="card"><h2>No-PHI audit log</h2><p class="muted" style="font-size:13px">No names, diagnoses, or plan text are ever stored here.</p>
  <div class="scroll-x"><table><thead><tr><th>discharge_id</th><th>event</th><th>created_at</th><th>expires_at</th><th>countdown</th><th>deleted_at</th><th>deleted_items</th></tr></thead><tbody id="auditBody">
  ${E.audit.map(a=>`<tr class="${a.state==='expiring'?'gone':''}" data-id="${a.id}"><td class="mono"><b>${a.id}</b></td><td><span class="chip ${a.event==='purged'?'gray':'blue'}">${a.event}</span></td><td class="tn mono">${utc(a.created)}</td><td class="tn mono">${utc(a.exp)}</td><td class="tn" ${a.state==='live'?`data-exp="${a.exp}"`:''}>${a.state==='live'?left(a.exp):a.state==='expiring'?'<span class="chip red">Expired</span>':'<span class="chip gray">Expired</span>'}</td><td class="tn mono">${a.del?utc(a.del):'—'}</td><td>${a.items}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="card"><h2>Server-set expiry proof</h2><p style="margin:6px 0 0"><span class="mono">expires_at = created_at + 2,592,000 seconds (30 days).</span> Set by the server. Not editable.</p>
   <div class="lockfield" aria-label="expires_at, locked">${ic('lock',18)}<span class="mono tn">${ex?utc(ex.exp):'—'}</span><span class="chip gray" style="margin-left:auto">read-only</span></div></div>
  ${demo?`<div class="card"><h2>Prove the self-destruct</h2><p class="muted">Instead of waiting 30 days, this control moves the clock forward for one record and runs the same purge job.</p>
   <button class="btn amber" data-act="tt" ${active&&!E.tt?'':'disabled'} style="border-width:3px">${ic('clock',18)}DEMO ONLY — Time-Travel: expire DSC-7Q2K now</button>
   ${E.tt?`<button class="btn ghost" data-act="resetdemo" style="margin-left:8px">Reset demo</button>`:''}</div>`:
   `<div class="banner blue" style="margin-top:16px">${ic('lock',22)}<span>Time-Travel is hidden in Production mode. The endpoint returns 403.</span></div>`}
  ${E.tt?`<div class="card" id="verify"><h2>Verification</h2><p class="muted">Independent checks that nothing is left behind.</p><div class="proof">
    <div class="card"><div class="mono">Database query: GET /discharges/DSC-7Q2K</div><p class="mono" style="margin:10px 0">→ 404 — no document found.</p><span class="chip red">${ic('x',14)}✗ not found</span></div>
    <div class="card"><div class="mono">Audio storage: GET /audio/DSC-7Q2K.mp3</div><p class="mono" style="margin:10px 0">→ Not found (object purged).</p><span class="chip red">${ic('x',14)}✗ not found</span></div></div>
    <p style="margin:12px 0 0"><b>The patient link now shows the expired page.</b></p></div>`:''}`;
}
function timeTravel(){
  const r=E.audit.find(a=>a.id==='DSC-7Q2K');if(!r||r.state!=='live')return;
  r.state='expiring';E.tt=true;go(E.view);
  const finish=()=>{
    E.audit=E.audit.filter(a=>a.id!=='DSC-7Q2K');
    E.audit.push({id:'DSC-7Q2K',event:'purged',created:r.created,exp:Date.now(),del:Date.now(),items:'audio, transcript, translations, chat logs',state:'purged'});
    go(E.view);toast('Record expired and purged. No PHI retained.');
    setTimeout(()=>$('#verify')?.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'}),80);
  };
  reduce?finish():setTimeout(finish,1300);
}

/* ---------- shell ---------- */
function go(v){
  E.view=v;$('#nav-esc').classList.toggle('on',v==='esc');$('#nav-audit').classList.toggle('on',v==='audit');
  $('#view').innerHTML=v==='esc'?rEsc():rAudit();hy($('#view'));closeMenu();
}
function setMode(m){E.mode=m;$('#m-demo').classList.toggle('on',m==='demo');$('#m-prod').classList.toggle('on',m==='prod');$('#m-demo').setAttribute('aria-pressed',m==='demo');$('#m-prod').setAttribute('aria-pressed',m==='prod');go(E.view)}
const MENU=[['Escalations',[['Who needs attention',()=>{E.esc='list';go('esc')}],['Empty state (all clear)',()=>{E.esc='empty';go('esc')}],['Patient-role access denied',()=>{E.esc='denied';go('esc')}],['Open patient drawer: Eleanor (weight trend)',()=>{E.esc='list';go('esc');openDrawer(1)}],['Open patient drawer: Harold (mental-health flag)',()=>{E.esc='list';go('esc');openDrawer(5)}]]],
 ['Audit and purge',[['Audit view (Demo mode)',()=>{setMode('demo');go('audit')}],['Time-Travel then verification',()=>{setMode('demo');if(E.tt)resetDemo();go('audit');timeTravel()}],['Audit view (Production mode, Time-Travel hidden)',()=>{setMode('prod');go('audit')}]]]];
function resetDemo(){E.audit=mkAudit();E.tt=false;go(E.view)}
function openMenu(){closeMenu();const m=document.createElement('div');m.className='menu';m.id='menu';m.setAttribute('role','menu');
  m.innerHTML=MENU.map((g,gi)=>`<div class="g">${g[0]}</div>`+g[1].map((it,ii)=>`<button role="menuitem" data-act="mi" data-g="${gi}" data-i="${ii}">${it[0]}</button>`).join('')).join('');document.body.appendChild(m)}
function closeMenu(){$('#menu')?.remove()}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a){if(!e.target.closest('.menu'))closeMenu();return}
  const v=a.dataset.v;
  switch(a.dataset.act){
   case'view':E.esc='list';go(v);break;case'menu':openMenu();break;
   case'mi':{const fn=MENU[+a.dataset.g][1][+a.dataset.i][1];closeMenu();fn();break}
   case'mode':setMode(v);break;
   case'drawer':openDrawer(v);break;
   case'closedrawer':$('#layer').innerHTML='';E.drawer=null;break;
   case'contacted':{const r=ROWS.find(x=>x.id==v);r.contacted=true;$('#layer').innerHTML='';go('esc');toast('Marked as contacted.');break}
   case'tt':timeTravel();break;case'resetdemo':resetDemo();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeMenu();if(E.drawer){$('#layer').innerHTML='';E.drawer=null}}
  if(e.key==='Tab'&&E.drawer){const f=$$('.drawer button');if(!f.length)return;const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
/* live countdowns: static under reduced motion */
if(!reduce)setInterval(()=>{$$('td[data-exp]').forEach(td=>td.textContent=left(+td.dataset.exp))},30000);
hy();go('esc');
</script>
</body>
</html>
